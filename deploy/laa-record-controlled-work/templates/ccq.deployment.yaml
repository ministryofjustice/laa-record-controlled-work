apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "laa-record-controlled-work.fullname" . }}-ccq
  labels:
    {{- include "laa-record-controlled-work.labels" . | nindent 4 }}
    app.kubernetes.io/component: ccq
spec:
  replicas: {{ .Values.ccq.replicaCount }}
  selector:
    matchLabels:
      {{- include "laa-record-controlled-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ccq
  template:
    metadata:
      labels:
        {{- include "laa-record-controlled-work.labels" . | nindent 8 }}
        app.kubernetes.io/component: ccq
    spec:
      serviceAccountName: {{ include "laa-record-controlled-work.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ccq
          image: "{{ .Values.ccq.image.repository }}:{{ .Values.ccq.image.tag }}"
          imagePullPolicy: {{ .Values.ccq.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ccq.env.REDIS_SECRET_NAME }}
                  key: url
            {{- range $key, $val := .Values.ccq.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range .Values.ccq.envSecrets }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.ccq.envSecretName }}
                  key: {{ . }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.ccq.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
