apiVersion: v1
kind: Service
metadata:
  name: {{ include "laa-record-controlled-work.fullname" . }}
  labels:
    {{- include "laa-record-controlled-work.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "laa-record-controlled-work.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx