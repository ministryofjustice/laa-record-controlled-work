{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laa-record-controlled-work.fullname" . }}-nginx-policy
  labels:
    {{- include "laa-record-controlled-work.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laa-record-controlled-work.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "ingress-controllers"
      ports:
        - protocol: TCP
          port: 8080
{{- end }}