proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $response_referrer_policy always;
add_header X-Frame-Options $response_x_frame_options always;
add_header Content-Security-Policy $response_frame_ancestors always;
