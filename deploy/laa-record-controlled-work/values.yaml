nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: ""
    external-dns.alpha.kubernetes.io/aws-weight: "100"

rcw:
  replicaCount: 1

  image:
    repository: nginx
    pullPolicy: Always
    tag: ""

  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60

  # Secret env vars — stored in a Kubernetes Secret, referenced via secretKeyRef in the deployment template.
  # envSecretName: the name of the Kubernetes Secret to create/update.
  envSecretName: env-secrets
  envSecrets:
    - SESSION_SECRET
    - SESSION_ENCRYPTION_KEY

  # Plain env vars - injected directly into the container. Add new vars here only; they are
  # automatically picked up by the Helm template and test workflows (via yq). Override per
  # environment by setting the key again in the relevant values/<env>.yaml file (maps deep-merge).
  env:
    SERVICE_NAME: "LAA Record Controlled Work"
    SERVICE_PHASE: "Beta"
    DEPARTMENT_NAME: "Legal Aid Agency"
    DEPARTMENT_URL: "https://www.gov.uk/government/organisations/legal-aid-agency"
    CONTACT_EMAIL: "eligibility@justice.gov.uk"
    CONTACT_PHONE: ""
    SERVICE_URL: "https://www.gov.uk/legal-aid"
    SESSION_NAME: "sessionId"
    RATELIMIT_HEADERS_ENABLED: true
    RATELIMIT_STORAGE_URI: ""
    RATE_LIMIT_MAX: 100
    RATE_WINDOW_MS: 900000
    NODE_ENV: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  volumes: []
  volumeMounts: []

  nodeSelector: {}
  tolerations: []
  affinity: {}
