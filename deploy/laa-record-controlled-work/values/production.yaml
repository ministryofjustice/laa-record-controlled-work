# Default values for laa-record-controlled-work.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "your-github-action-service-account"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  hosts:
    - host: your-production-namespace.cloud-platform.service.justice.gov.uk
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: "ingress-name-laa-record-controlled-work-laa-record-controlled-work-production-green"
    external-dns.alpha.kubernetes.io/aws-weight: "100"

rcw:
  # this is set as 2 prior to launch, we should increase this to 5 when the service is launched
  # and we are ready for live users, staging replicaCount should match production
  replicaCount: 2

  image:
    repository: nginx
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""

  imagePullSecrets: []
  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 60

  env:
    SERVICE_NAME: "Express TypeScript Template"
    SERVICE_PHASE: "Beta"
    DEPARTMENT_NAME: "Legal Aid Agency"
    DEPARTMENT_URL: "https://www.gov.uk/government/organisations/legal-aid-agency"
    CONTACT_EMAIL: "eligibility@justice.gov.uk"
    CONTACT_PHONE: ""
    SERVICE_URL: "https://www.gov.uk/legal-aid"
    SESSION_NAME: "sessionId"
    RATELIMIT_HEADERS_ENABLED: true
    RATELIMIT_STORAGE_URI: ""
    RATE_LIMIT_MAX: 100
    RATE_WINDOW_MS: 900000
    NODE_ENV: "production"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Additional volumes on the output Deployment definition.
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

  nodeSelector: {}

  tolerations: []

  affinity: {}
