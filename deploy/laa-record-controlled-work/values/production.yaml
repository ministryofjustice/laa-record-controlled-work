serviceAccount:
  name: rcw-github-action-service-account

ingress:
  className: default
  hosts:
    - host: record-controlled-work.service.justice.gov.uk
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - record-controlled-work.service.justice.gov.uk
      secretName: rcw-production-cert-secret
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: "laa-record-controlled-work-laa-record-controlled-work-production-green"

rcw:
  replicaCount: 2

  env:
    NODE_ENV: production
    ENTRA_REDIRECT_URI: https://record-controlled-work.service.justice.gov.uk/auth/code/callback
    ENTRA_ADDITIONAL_SCOPES: api://rcw-api/Applications.Read
    RCW_API_BASE_URL: http://laa-record-controlled-work-api.laa-record-controlled-work-api-production.svc:8081
    PDA_API_BASE_URL: https://laa-provider-details-api-prod.apps.live.cloud-platform.service.justice.gov.uk
    SENTRY_ENV: "production"

ccq:
  replicaCount: 2