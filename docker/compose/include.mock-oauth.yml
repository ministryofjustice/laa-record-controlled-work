# Reusable building block: mock OAuth2 server with interactive login (Authorization Code
# sign-in) plus the jwt-bearer grant used for the rcw-api -> datastore OBO exchange.
#
# RCW is the entry point for user sign-in, so it owns this definition - other repos
# (laa-record-controlled-work-api, laa-info-and-advice-datastore) define their own
# equivalent for standalone use, but only one mock-oauth2-server should run at a time
# when composing a full stack.
services:
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: mock-oauth2-server
    ports:
      - "9090:9090"
    environment:
      - SERVER_PORT=9090
      - JSON_CONFIG_PATH=/etc/mock-oauth2-config.json
    volumes:
      - ../../mock-oauth2-config.json:/etc/mock-oauth2-config.json
      - ../../mock-oauth2-login.html:/etc/mock-oauth2-login.html
