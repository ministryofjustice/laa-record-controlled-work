services:
  rcw:
    build: .
    container_name: rcw-front-end
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=docker
      - REDIS_URL=redis://redis:6379

      # secrets injected by 1Password CLI
      # op run --env-file=.env -- docker compose up -d
      - ENTRA_CLIENT_ID
      - ENTRA_TENANT_ID
      - ENTRA_CLIENT_SECRET
      - ENTRA_REDIRECT_URI
      - ENTRA_AUTHORITY_BASE_URL
      - ENTRA_POST_LOGOUT_REDIRECT_URI
    depends_on:
      - redis

  # ccq:
  #   image:
  #   expose:
  #     - "3000"

  nginx:
    image: nginxinc/nginx-unprivileged:${NGINX_IMAGE_TAG:-alpine}
    container_name: nginx-reverse-proxy
    environment:
      NGINX_UPSTREAM_RCW: rcw:3000
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/laa-record-controlled-work/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - rcw
      # - ccq

  redis:
    container_name: rcw-redis-session
    image: "redis:7.2-alpine"
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  # - --save "" — turns off RDB snapshotting (no periodic dump to disk)                                                                                                                                                                      
  # - --appendonly no — turns off AOF (append-only file) logging       