services:
  rcw:
    build: .
    container_name: rcw-front-end
    env_file:
      - .env.resolved
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: dev-secret
      SESSION_NAME: sessionId
      RATELIMIT_HEADERS_ENABLED: "false"
      RATELIMIT_STORAGE_URI: ""
      RATE_LIMIT_MAX: "100"
      RATE_WINDOW_MS: "900000"
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  # ccq:
  #   image:
  #   expose:
  #     - "3000"

  nginx:
    image: nginxinc/nginx-unprivileged:${NGINX_IMAGE_TAG:-alpine}
    container_name: nginx-reverse-proxy
    env_file:
      - docker-images.env
    environment:
      NGINX_UPSTREAM_RCW: rcw:3000
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/laa-record-controlled-work/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - rcw
      # - ccq

  redis:
    container_name: rcw-redis-session
    image: "redis:7.2-alpine"
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  # - --save "" — turns off RDB snapshotting (no periodic dump to disk)                                                                                                                                                                      
  # - --appendonly no — turns off AOF (append-only file) logging       