# Injected secrets need to pull the env var from the host machine
# This happens automatically if you provide only the env var name.
include:
  - path: ../laa-record-controlled-work-api/docker/compose/include.api.yml
  - path: ../laa-info-and-advice-datastore/docker/compose/include.api.yml
  - path: ../laa-info-and-advice-datastore/docker/compose/include.postgres.yml
  - path: ../laa-check-client-qualifies/docker-compose.embedded.yml
  - path: docker/compose/include.mock-oauth.yml

services:
  nginx:
    container_name: nginx-reverse-proxy  
    image: nginxinc/nginx-unprivileged:${NGINX_IMAGE_TAG:-alpine}
    container_name: rcw-nginx
    ports:
      - 8080:8080
    volumes:
      - ./deploy/laa-record-controlled-work/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/laa-record-controlled-work/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./deploy/laa-record-controlled-work/nginx/maps.conf:/etc/nginx/maps.conf:ro
    depends_on:
      - rcw
      - ccq-embedded
    environment:
      NGINX_UPSTREAM_RCW: rcw:3000
      NGINX_UPSTREAM_CCQ: ccq-embedded:3000

  rcw:
    build:
      context: .
      target: dev
    container_name: rcw-front-end
    command: yarn watch
    expose:
      - 3000
    depends_on:
      redis-rcw:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # MSAL requires an https authority (even for the local mock IdP) - trust its self-signed cert.
      - ./docker/certs/mock-oauth2-server.crt.pem:/etc/mock-oauth2-server.crt.pem:ro
    env_file:
      - .env # load from .env first
    environment: # set overrides
      - NODE_ENV=docker
      - API_MODE=api
      - RCW_API_BASE_URL=http://rcw-api:8081
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis-rcw:6379
      - REDIS_AUTH_TOKEN=${REDIS_AUTH_TOKEN:-redis_password}
      - ENTRA_REDIRECT_URI=http://localhost:8080/auth/code/callback
      - NODE_EXTRA_CA_CERTS=/etc/mock-oauth2-server.crt.pem
      # Signs in via the mock-oauth2-server container by default, matching rcw-api and
      # info-and-advice-api's own defaults - see docker-compose.entra.yml to sign in via real
      # Entra ID instead. MSAL rejects non-https authorities, so the mock server terminates
      # TLS with a self-signed cert (see docker/certs) covering host.docker.internal.
      - ENTRA_AUTHORITY_BASE_URL=https://host.docker.internal:9090/
      - ENTRA_TENANT_ID=default
      - ENTRA_CLIENT_ID=rcw
      - ENTRA_CLIENT_SECRET=not-used-by-mock-oauth2-server
      # secrets injected by 1Password CLI via .env
      # op run --env-file=.env -- docker compose up -d
      - PDA_API_KEY
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./esbuild
          target: /app/esbuild
        - action: sync
          path: ./locales
          target: /app/locales
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./scripts
          target: /app/scripts
        - action: sync
          path: ./tests/mocks
          target: /app/tests/mocks
        - action: rebuild
          path: package.json
        - action: rebuild
          path: yarn.lock

  redis-rcw:
    container_name: rcw-session-redis
    image: "redis:8.8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb"
    ports:
      - 6379:6379
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5