approvedGitRepositories:
  - "**"

# Allows logs from postinstall scripts to be displayed in the console during yarn install
enableInlineBuilds: true

# Disables third party postinstall scripts from running during yarn install. 
# This is a security measure to prevent potentially malicious scripts.
enableScripts: false

nodeLinker: node-modules

npmMinimalAgeGate: 7d


# fix snyk issues by preapproving these package versions
npmPreapprovedPackages:
#   ✗ Directory Traversal (new) [High Severity][https://security.snyk.io/vuln/SNYK-JS-MOMENT-19821607] in moment@2.30.1
#   Remove on 23/09/2026
  - "moment@2.31.0"
