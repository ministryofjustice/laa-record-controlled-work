name: Mirror nginx-unprivileged to ECR
#
#  Checks daily for the newest version of nginxinc/nginx-unprivileged that has an
#  alpine tag at least 3 days old (to give CVEs time to surface). If a newer version
#  is found than the one stored in docker-images.env, it pulls the image, scans it
#  with Snyk, pushes it to our private ECR and then opens a PR updating
#  docker-images.env with the new tag and ECR digest.
#
#  Since this workflow runs on an AMD64 runner, skopeo and docker both resolve to the
#  AMD64 image. NGINX_ECR_IMAGE_DIGEST_AMD64 holds the AMD64 digest as ECR recorded it,
#  which is what deploy.sh uses for SHA-pinned deployments to EKS.
#
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip ECR push and PR steps (for testing)"
        type: boolean
        default: false
      skip_age_check:
        description: "Skip the 3-day age gate"
        type: boolean
        default: false
      skip_version_check:
        description: "Skip version change detection (e.g. for disaster recovery)"
        type: boolean
        default: false
      override_tag:
        description: "Mirror a specific tag instead of latest (e.g. 1.28.0-alpine). Skips version and age checks."
        type: string
        default: ""

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.fetch_metadata.outputs.tag }}
      amd64_digest: ${{ steps.fetch_metadata.outputs.amd64_digest }}
      proceed: ${{ steps.pr_check.outputs.no_existing_pr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Find newest eligible nginx-unprivileged version
        id: fetch_metadata
        env:
          OVERRIDE_TAG: ${{ inputs.override_tag }}
          SKIP_AGE_CHECK: ${{ inputs.skip_age_check }}
          SKIP_VERSION_CHECK: ${{ inputs.skip_version_check }}
        run: ./scripts/find-nginx-update.sh

      - name: Check for existing PR
        id: pr_check
        if: steps.fetch_metadata.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/mirror-nginx-${{ steps.fetch_metadata.outputs.tag }}"
          COUNT=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$COUNT" = "0" ]; then
            echo "No existing PR for branch \`${BRANCH}\` - proceeding." >> "$GITHUB_STEP_SUMMARY"
            echo "no_existing_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR already open for branch \`${BRANCH}\` - skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "no_existing_pr=false" >> "$GITHUB_OUTPUT"
          fi

  scan-and-mirror:
    name: Scan and mirror
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      ecr_digest: ${{ steps.push.outputs.ecr_digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pull nginx-unprivileged image from Docker Hub
        run: |
          IMAGE="nginxinc/nginx-unprivileged@${{ needs.check.outputs.amd64_digest }}"
          docker pull "$IMAGE"
          docker save "$IMAGE" -o nginx.tar

      - name: Scan image with Snyk
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04
        with:
          image: nginx.tar
          args: --docker --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Configure AWS credentials
        if: inputs.dry_run != true
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ secrets.NGINX_ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.NGINX_ECR_REGION }}

      - name: Login to ECR
        if: inputs.dry_run != true
        uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78

      - name: Push nginx to ECR
        id: push
        if: inputs.dry_run != true
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          ECR_IMAGE="${{ secrets.ECR_REGISTRY_URL }}/${{ vars.NGINX_ECR_REPOSITORY }}:${TAG}"

          docker tag \
            "nginxinc/nginx-unprivileged@${{ needs.check.outputs.amd64_digest }}" \
            "${ECR_IMAGE}"
          docker push "${ECR_IMAGE}"

          ECR_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ vars.NGINX_ECR_REPOSITORY }}" \
            --region "${{ vars.NGINX_ECR_REGION }}" \
            --image-ids imageTag="${TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "ecr_digest=$ECR_DIGEST" >> "$GITHUB_OUTPUT"

  raise-update-pr:
    name: Raise update PR
    needs: [check, scan-and-mirror]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Update docker-images.env
        id: open-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          ECR_DIGEST="${{ needs.scan-and-mirror.outputs.ecr_digest }}" # - deploy.sh SHA-pinned deployments
          DOCKERHUB_DIGEST="${{ needs.check.outputs.amd64_digest }}" # - SCA image scanning
          BRANCH="chore/mirror-nginx-${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          sed -i "s|^NGINX_IMAGE_TAG=.*|NGINX_IMAGE_TAG=${TAG}|" docker-images.env
          sed -i \
            "s|^NGINX_ECR_IMAGE_DIGEST_AMD64=.*|NGINX_ECR_IMAGE_DIGEST_AMD64=${ECR_DIGEST}|" \
            docker-images.env

          jq --arg digest "docker.io/nginxinc/nginx-unprivileged@${DOCKERHUB_DIGEST}" \
            '(.images[] | select(startswith("docker.io/nginxinc/nginx-unprivileged"))) = $digest' \
            docker-images.json > docker-images.json.tmp
          mv docker-images.json.tmp docker-images.json

          git add docker-images.env docker-images.json
          git commit -m "chore: mirror nginx-unprivileged@${TAG} to ECR"
          git push origin "$BRANCH"

          TAG_URL="https://hub.docker.com/layers/nginxinc/nginx-unprivileged/${TAG}"
          BODY="Mirrors [nginxinc/nginx-unprivileged@${TAG}](${TAG_URL}) to ECR."
          BODY+=$'\n\n''Updates `docker-images.env`:'
          BODY+=$'\n- ''`NGINX_IMAGE_TAG` to `'"${TAG}"'`'
          BODY+=$'\n- ''`NGINX_ECR_IMAGE_DIGEST_AMD64` to `'"${ECR_DIGEST}"'`'
          BODY+=$'\n\n''Updates `docker-images.json` nginx entry to `docker.io/nginxinc/nginx-unprivileged@'"${DOCKERHUB_DIGEST}"'`.'
          BODY+=$'\n\n''> [!NOTE]'
          BODY+=$'\n''> Required workflows will not trigger automatically on this PR. Run the following to trigger them:'
          BODY+=$'\n''> ```'
          BODY+=$'\n''> ./scripts/trigger-ci-on-branch.sh '"${BRANCH}"
          BODY+=$'\n''> ```'

          PR_URL=$(gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "Mirror nginx-unprivileged ${TAG} to ECR" \
            --body "$BODY")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Close superseded PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_PR_NUMBER=$(echo "${{ steps.open-pr.outputs.pr_url }}" | grep -o '[0-9]*$')
          gh pr list \
            --search "Mirror nginx-unprivileged in:title" \
            --state open \
            --json number \
            --jq ".[].number | select(. != $NEW_PR_NUMBER)" \
          | while read -r number; do
              gh pr close "$number" --comment "Superseded by ${{ steps.open-pr.outputs.pr_url }}"
            done
