name: Playwright
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows
    inputs:
      sha:
        description: "Commit SHA to check out"
        type: string
        default: ''

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Build application
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: public/
          retention-days: 1
          overwrite: true

  playwright:
    name: Tests
    needs: setup
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: public/

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --with-deps

      - name: Set env vars from values
        run: |
          yq '.rcw.env | to_entries[] | select(.value != "") | .key + "=" + (.value | tostring)' \
            ./deploy/laa-record-controlled-work/values.yaml >> $GITHUB_ENV

      - name: Run Playwright tests
        run: yarn playwright test --config=tests/playwright/playwright.config.ts --grep-invert @accessibility
        env:
          CI: true
          PLAYWRIGHT_TRACING: "on"
          NODE_ENV: "test"
          SESSION_SECRET: "playwright-test-secret"
          SESSION_ENCRYPTION_KEY: "playwright-test-encryption-key"

      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: |
            test-results/**/trace*.zip
            test-results/**/*.webm
          retention-days: 14

      - name: Notify on test failure
        if: failure()
        run: echo "::error::Playwright tests failed! Check the test report for details."

  accessibility:
    name: Accessibility
    needs: setup
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: public/

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --with-deps

      - name: Set env vars from values
        run: |
          yq '.rcw.env | to_entries[] | select(.value != "") | .key + "=" + (.value | tostring)' \
            ./deploy/laa-record-controlled-work/values.yaml >> $GITHUB_ENV

      - name: Run Accessibility Tests
        run: yarn playwright test --config=tests/playwright/playwright.config.ts --grep @accessibility
        env:
          CI: true
          NODE_ENV: "test"
          SESSION_SECRET: "accessibility-test-secret"
          SESSION_ENCRYPTION_KEY: "accessibility-test-encryption-key"

      - name: Upload Accessibility Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Notify on accessibility failure
        if: failure()
        run: echo "::error::Accessibility tests failed! Check the accessibility report for details."
