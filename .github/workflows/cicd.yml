name: CICD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: yarn eslint .

      - name: Run Knip dependency linting
        run: yarn knip

  code-security-audit:
    name: Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Run security audit
        run: yarn npm audit

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build local Docker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t laa-record-controlled-work ./
          docker save laa-record-controlled-work -o image.tar

      - name: Run Snyk to scan Docker image from tarball
        uses: snyk/actions/docker@8e119fbb6c251787721d34ba683ed48eba792766 # master
        with:
          image: image.tar
          args: --docker --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-infra:
    name: Snyk Infra Scan
    uses: ./.github/workflows/snyk-infra.yml
    secrets: inherit

  mocha-unit-tests:
    name: Mocha Unit Tests
    uses: ./.github/workflows/mocha.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}

  playwright:
    name: Playwright Tests
    uses: ./.github/workflows/playwright.yml
    with:
      sha: ${{ github.event.pull_request.head.sha || github.sha }}

  intentional-ci-failure-test:
    name: Intentional CI Failure Test
    runs-on: ubuntu-latest
    steps:
      - name: Fail intentionally to test CI notification
        run: |
          echo "::error::Intentional CI failure to verify Slack notification"
          exit 1

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up AWS credentials for ECR and Kubernetes
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@f2e9fc6c2b355c1890b65e6f6f0e2ac3e6e22f78
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      - name: Cache Docker layers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push image with local action
        uses: ./.github/actions/build_and_push
        with:
          image_registry: ${{ secrets.ECR_REGISTRY_URL }}
          image_repo: ${{ vars.ECR_REPOSITORY }}
          dockerfile_path: Dockerfile
          image_tag: ${{ github.event.pull_request.head.sha || github.sha }}

  notify-main-ci-failure:
    name: Notify Main CI Failure
    if: ${{ always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment: uat
    needs:
      - code-linting
      - code-security-audit
      - snyk
      - snyk-infra
      - mocha-unit-tests
      - playwright
      - intentional-ci-failure-test
      - build-image
    steps:
      - name: Notify Slack on CI failure
        uses: ./.github/actions/notify-slack
        with:
          slack-bot-token: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
          slack-mention: ${{ vars.SLACK_ALERTS_MENTION }}
          message: |
            :red_circle: Main branch CI failed for RCW
            Jobs monitored: `code-linting`, `code-security-audit`, `snyk`, `snyk-infra`, `mocha-unit-tests`, `playwright`, `intentional-ci-failure-test`, `build-image`
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}

  deploy-uat:
    if: github.event_name != 'merge_group' && !(github.event_name == 'pull_request' && github.actor == 'renovate[bot]')
    uses: ./.github/workflows/deploy-environment.yml
    with:
      app-environment: uat
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      branch-ref: ${{ github.head_ref }}
    concurrency:
      group: deploy-uat-${{ github.ref }}
      cancel-in-progress: false
    needs:
      - code-linting
      - code-security-audit
      - snyk
      - build-image
      - mocha-unit-tests
      - playwright
      - snyk-infra
    secrets: inherit

