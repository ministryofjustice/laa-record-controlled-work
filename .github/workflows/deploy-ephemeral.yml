name: Deploy ephemeral environment for PR

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'DEPLOY-EPHEMERAL') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'DEPLOY-EPHEMERAL'))
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorized: ${{ steps.check-permissions.outputs.authorized }}
    steps:
      - name: Check actor has push access
        id: check-permissions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          permission=$(
            gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
              --jq '.permission' 2>/dev/null || echo "none"
          )
          if [[ "$permission" == "write" || "$permission" == "admin" || "$permission" == "maintain" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post acknowledgement comment
        if: steps.check-permissions.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body "Ephemeral environment deployment triggered for commit \`${PR_SHA:0:7}\`. [View run](${RUN_URL})"

  deploy:
    name: Deploy
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      branch-ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  post-deployment-result:
    name: Post deployment result
    runs-on: ubuntu-latest
    needs:
      - authorize
      - deploy
    if: always() && needs.authorize.result == 'success' && needs.authorize.outputs.authorized == 'true'
    permissions:
      pull-requests: write
    steps:
      - name: Post success comment
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # duplicated from scripts/deploy.sh:6
          release_name=$(
            echo "${PR_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's:^\w*\/::' | tr -s ' _/[]().' '-' |\
              cut -c1-18 | sed 's/-$//'
          )

          url="https://${release_name}-laa-record-controlled-work-uat.cloud-platform.service.justice.gov.uk"
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body "Ephemeral environment deployed successfully, it can be accessed at ${url}"

      - name: Post failure comment
        if: needs.deploy.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body "Ephemeral environment deployment failed. [View workflow run](${RUN_URL})"
