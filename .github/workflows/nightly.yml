name: Nightly CI

on:
  schedule:
    # Renovate may merge until 05:00 Europe/London; leave time for its build.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-main-image:
    name: Resolve main image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_digest: ${{ steps.resolve.outputs.image_digest }}
    steps:
      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Resolve main image digest
        id: resolve
        env:
          IMAGE_REPO: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$IMAGE_REPO" || ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Main image repository or commit tag is invalid"
            exit 1
          fi

          image_digest=
          for attempt in {1..11}; do
            if image_digest=$(aws ecr describe-images \
              --repository-name "$IMAGE_REPO" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>&1); then
              break
            fi

            lookup_error=$image_digest
            image_digest=
            if [[ "$lookup_error" != *ImageNotFoundException* ]]; then
              printf '%s\n' "$lookup_error" >&2
              echo "::error::Failed to query ECR for main commit $IMAGE_TAG"
              exit 1
            fi

            if [[ "$attempt" -eq 11 ]]; then
              printf '%s\n' "$lookup_error" >&2
              echo "::error::No ECR image found for main commit $IMAGE_TAG after waiting 5 minutes"
              exit 1
            fi

            echo "Image tag not available yet; retrying in 30 seconds (attempt $attempt/11)"
            sleep 30
          done

          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No valid ECR image digest found for main commit $IMAGE_TAG"
            exit 1
          fi

          printf 'image_digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"

  snyk:
    name: Snyk report
    needs: resolve-main-image
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/snyk.yml
    with:
      source_sha: ${{ github.sha }}
      scan_mode: absolute
      fail_on_findings: true
      image_digest: ${{ needs.resolve-main-image.outputs.image_digest }}
      image_repo: ${{ vars.ECR_REPOSITORY }}
    secrets: inherit

  notify-nightly-snyk-failure:
    name: Notify Nightly Snyk Failure
    if: ${{ always() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    environment: uat
    needs:
      - resolve-main-image
      - snyk
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Notify Slack on nightly Snyk failure
        uses: ./.github/actions/notify-slack
        with:
          slack-bot-token: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
          slack-channel-id: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
          slack-mention: ${{ vars.SLACK_ALERTS_MENTION }}
          message: |
            :red_circle: *Nightly Snyk scan failed for RCW `main` branch*

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}