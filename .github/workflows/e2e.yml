name: E2E Tests
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to check out"
        type: string
        default: ''

jobs:
  e2e:
    name: End-to-end
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      - name: Start docker-compose stack
        run: docker/compose/up --ci
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          COMPOSE_BAKE: "true"
          GITHUB_TOKEN: ${{ github.token }}
          PDA_API_KEY: ci-placeholder

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          CI: "true"
          E2E_AUTH_MODE: mock

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml down --volumes --remove-orphans
