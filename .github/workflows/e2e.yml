name: E2E Tests
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to check out"
        type: string
        default: ''

jobs:
  e2e:
    name: End-to-end
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Start docker-compose stack
        run: docker/compose/up --ci
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
          COMPOSE_BAKE: "true"
          GITHUB_TOKEN: ${{ github.token }}
          PDA_API_KEY: ci-placeholder

      - name: Capture dependency image metadata
        if: always()
        run: |
          set +e
          mkdir -p container-logs
          compose_files=(
            -f docker-compose.yml
            -f docker-compose.override.yml
            -f docker/compose/ci.yml
          )
          {
            echo "GitHub SHA: $GITHUB_SHA"
            echo "GitHub ref: $GITHUB_REF"
            echo "Docker version:"
            docker version
            echo "Docker Compose version:"
            docker compose version
            echo "Compose images configured:"
            docker compose "${compose_files[@]}" config --images || true
            echo "Compose service state:"
            docker compose "${compose_files[@]}" ps --all || true
            echo "Compose images:"
            docker compose "${compose_files[@]}" images || true

            for service in rcw-api info-and-advice-api ccq-embedded cfe rcw; do
              container_id=$(docker compose "${compose_files[@]}" ps -q "$service" || true)
              if [[ -z "$container_id" ]]; then
                echo "service=$service container=not-running"
                continue
              fi

              image_id=$(docker inspect --format '{{.Image}}' "$container_id")
              echo "service=$service container=$container_id"
              docker image inspect "$image_id" --format \
                'image_id={{.Id}} created={{.Created}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'
              docker image inspect "$image_id" --format '{{range .RepoDigests}}repo_digest={{.}}{{"\\n"}}{{end}}'
            done
          } > container-logs/image-metadata.txt 2>&1
          echo "Metadata collection completed with exit code $?" >> container-logs/image-metadata.txt
          exit 0

      - name: Upload dependency image metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-image-metadata
          path: container-logs/image-metadata.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare ZAP HAR directory
        run: |
          rm -rf zap-results/hars
          mkdir -p zap-results/hars
          chmod 777 zap-results

      - name: Run E2E tests
        run: yarn test:e2e
        env:
          CI: "true"
          E2E_AUTH_MODE: mock
          E2E_ZAP_HAR_DIRECTORY: ${{ github.workspace }}/zap-results/hars

      - name: Run ZAP Automation Framework scan
        if: github.event_name == 'pull_request'
        run: ./zap/run-cicd.sh

      - name: Upload ZAP scan reports
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-scan-reports
          path: |
            zap-results/zap-baseline-report.html
            zap-results/zap-baseline-report.json
            zap-results/zap_out.json
            zap-results/e2e-suite.har
            zap-results/hars/
          retention-days: 14

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p container-logs
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.override.yml \
            -f docker/compose/ci.yml \
            logs --no-color > container-logs/docker-compose.log 2>&1 || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-container-logs
          path: container-logs/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml down --volumes --remove-orphans
