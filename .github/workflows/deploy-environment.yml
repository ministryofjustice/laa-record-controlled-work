name: Deploy to Environment

on:
  workflow_call:
    inputs:
      app-environment:
        required: true
        type: string
      sha:
        description: "Commit SHA to deploy"
        type: string
        required: true
      branch-ref:
        description: "Branch ref for ephemeral deployments"
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy to ${{ inputs.app-environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.app-environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Deploy
        uses: ./.github/actions/deploy
        env:
          # This block only contains secrets being used as pod
          # environment variables. Anything used by the workflow
          # should be an input.
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
        with:
          sha: ${{ inputs.sha }}
          branch-ref: ${{ inputs.branch-ref }}
          app-environment: ${{ inputs.app-environment }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ccq-ecr-repository: ${{ vars.CCQ_ECR_REPOSITORY }}
          nginx-ecr-repository: ${{ vars.NGINX_ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
