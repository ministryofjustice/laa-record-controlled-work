name: Deploy to Environment

on:
  workflow_call:
    inputs:
      app-environment:
        required: true
        type: string
      sha:
        description: "Commit SHA to deploy"
        type: string
        required: true
      branch-ref:
        description: "Branch ref for ephemeral deployments"
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy to ${{ inputs.app-environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.app-environment }}
    permissions:
      issues: write # needed for labels
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          sha: ${{ inputs.sha }}
          branch-ref: ${{ inputs.branch-ref }}
          app-environment: ${{ inputs.app-environment }}
          slack-alerts-bot-token: ${{ secrets.SLACK_ALERTS_BOT_TOKEN }}
          slack-alerts-channel-id: ${{ vars.SLACK_ALERTS_CHANNEL_ID }}
          slack-alerts-mention: ${{ vars.SLACK_ALERTS_MENTION }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ccq-ecr-repository: ${{ vars.CCQ_ECR_REPOSITORY }}
          nginx-ecr-repository: ${{ vars.NGINX_ECR_REPOSITORY }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
