name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: yarn lint

  code-security-audit:
    name: Code Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Run security audit
        run: yarn npm audit

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build local Docker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build -t laa-record-controlled-work ./
          docker save laa-record-controlled-work -o image.tar

      - name: Run Snyk to scan Docker image from tarball
        uses: snyk/actions/docker@master
        with:
          image: image.tar
          args: --docker --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  mocha-unit-tests:
    name: Mocha Unit Tests
    uses: ./.github/workflows/mocha.yml

  playwright:
    name: Playwright Tests
    uses: ./.github/workflows/playwright.yml

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up AWS credentials for ECR and Kubernetes
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076
        id: login-ecr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push image with local action
        uses: ./.github/actions/build_and_push
        with:
          image_registry: ${{ secrets.ECR_REGISTRY_URL }}
          image_repo: ${{ vars.ECR_REPOSITORY }}
          dockerfile_path: Dockerfile
          image_tag: ${{ github.sha }}

  deploy-uat:
    environment: uat
    runs-on: ubuntu-latest
    needs:
      - code-linting
      - code-security-audit
      - snyk
      - build-image
      - mocha-unit-tests
      - playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to UAT
        uses: ./.github/actions/deploy
        with:
          app-environment: uat
          ecr-repository: ${{ vars.ECR_REPOSITORY }}
          ecr-registry_url: ${{ secrets.ECR_REGISTRY_URL }}
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}
          session_secret: ${{ secrets.SESSION_SECRET }}
          session_encryption_key: ${{ secrets.SESSION_ENCRYPTION_KEY }}

          # service_name: ${{ vars.SERVICE_NAME }}
          # service_phase: ${{ vars.SERVICE_PHASE }}
          # department_name: ${{ vars.DEPARTMENT_NAME }}
          # department_url: ${{ vars.DEPARTMENT_URL }}
          # contact_email: ${{ vars.CONTACT_EMAIL }}
          # service_url: ${{ vars.SERVICE_URL }}
          # session_name: ${{ vars.SESSION_NAME}}
          # ratelimit_headers_enabled: ${{ vars.RATELIMIT_HEADERS_ENABLED }}
          # ratelimit_storage_uri: ${{ vars.RATELIMIT_STORAGE_URI }}
          # ratelimit_max: ${{ vars.RATE_LIMIT_MAX }}
          # ratewindow_ms: ${{ vars.RATE_WINDOW_MS }}

          # require_jar: ${{ vars.REQUIRE_JAR }}
          # identity_supported: ${{ vars.IDENTITY_SUPPORTED }}

          # oidc_client_id: ${{ secrets.OIDC_CLIENT_ID }}
          # oidc_private_key: ${{ secrets.OIDC_PRIVATE_KEY }}
          # oidc_issuer: ${{ vars.OIDC_ISSUER }}
          # oidc_token_auth_method: ${{ vars.OIDC_TOKEN_AUTH_METHOD }}
          # oidc_scopes: ${{ vars.OIDC_SCOPES }}
          # oidc_claims: ${{ vars.OIDC_CLAIMS }}
          # oidc_authorize_redirect_url: ${{ vars.OIDC_AUTHORIZE_REDIRECT_URL }}
          # oidc_post_logout_redirect_url: ${{ vars.OIDC_POST_LOGOUT_REDIRECT_URL }}
