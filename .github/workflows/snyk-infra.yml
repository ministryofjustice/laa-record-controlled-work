name: Snyk Infrastructure as Code

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # for github/codeql-action/upload-sarif to get workflow run info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Render Helm templates
        run: |
          mkdir rendered-templates
          for env in uat staging production; do
            helm template deploy/laa-record-controlled-work \
              -f deploy/laa-record-controlled-work/values/${env}.yaml \
              > rendered-templates/${env}.yaml
          done

      - name: Run Snyk to check Helm manifests for security issues
        continue-on-error: true
        uses: snyk/actions/iac@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: rendered-templates/

      - name: Upload deploy results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4
        with:
          sarif_file: snyk.sarif
          category: snyk-infrastructure

      - name: Upload rendered templates for inspection
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: rendered-templates
          path: rendered-templates/
