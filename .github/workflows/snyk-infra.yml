# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which checks out your Infrastructure as Code Configuration files,
# such as Kubernetes, Helm & Terraform and scans them for any security issues.
# The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Infrastructure as Code

on:
  schedule:
    - cron: "30 21 * * 1" # at 21:30 on Monday evening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Snyk to check infrastructure files for security issues
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the issues to GitHub Code Scanning
        continue-on-error: true
        uses: snyk/actions/iac@v1.0.0
        env:
          # In order to use the Snyk Action you will need to have a Snyk API token.
          # More details in https://github.com/snyk/actions#getting-your-snyk-token
          # or you can signup for free at https://snyk.io/login
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # Add the path to the configuration file that you would like to test.
          # For example `deployment.yaml` for a Kubernetes deployment manifest
          # or `main.tf` for a Terraform configuration file
          file: infrastructure/
          sarif: false
          args: --sarif-file-output=snyk-infrastructure.sarif

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render Helm templates
        run: |
          helm template deploy/laa-record-controlled-work \
            -f deploy/laa-record-controlled-work/values/uat.yaml \
            > rendered-values.yaml

      - name: Run Snyk to check Helm manifests for security issues
        continue-on-error: true
        uses: snyk/actions/iac@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: rendered-values.yaml
          sarif: false
          args: --sarif-file-output=snyk-deploy.sarif

      - name: Debug
        run: |
          echo "pwd:"
          pwd 
          echo "files:"
          ls -la
          echo "find SARIF files:"
          find . -name "*.sarif" 2>/dev/null || echo "None found"

      - name: Upload infrastructure results to GitHub Code Scanning
        if: hashFiles('snyk-infrastructure.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-infrastructure.sarif
          category: snyk-infrastructure-check

      - name: Upload deploy results to GitHub Code Scanning
        if: hashFiles('snyk-deploy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-deploy.sarif
          category: snyk-deploy-check
