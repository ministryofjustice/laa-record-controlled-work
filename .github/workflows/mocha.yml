name: Mocha
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows
    inputs:
      sha:
        description: "Commit SHA to check out"
        type: string
        default: ''

jobs:
  unit-tests:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Set env vars from values
        run: |
          yq '.rcw.env | to_entries[] | select(.value != "") | .key + "=" + (.value | tostring)' \
            ./deploy/laa-record-controlled-work/values.yaml >> $GITHUB_ENV

      - name: Run Mocha unit tests & c8 code coverage
        run: yarn unit:coverage
        env:
          CI: true
          NODE_ENV: "test"
          SESSION_SECRET: "mocha-test-secret"
          SESSION_ENCRYPTION_KEY: "mocha-test-encryption-key"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-report
          path: coverage/

  integration-tests:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Set env vars from values
        run: |
          yq '.rcw.env | to_entries[] | select(.value != "") | .key + "=" + (.value | tostring)' \
            ./deploy/laa-record-controlled-work/values.yaml >> $GITHUB_ENV

      - name: Run Mocha integration tests
        run: yarn integration
        env:
          CI: true
          NODE_ENV: "test"
          SESSION_SECRET: "mocha-test-secret"
          SESSION_ENCRYPTION_KEY: "mocha-test-encryption-key"
