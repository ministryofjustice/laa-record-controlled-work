name: Snyk vulnerability delta
description: Compare Open Source findings with an explicitly configured monitored main baseline
inputs:
  org-id:
    description: Snyk organization UUID
    required: true
  open-source-project-id:
    description: Explicit monitored Open Source project UUID
    required: true
  snyk-client-id:
    description: Snyk OAuth client ID
    required: true
  snyk-client-secret:
    description: Snyk OAuth client secret
    required: true
outputs:
  outcome:
    description: Aggregate result, either passed or failed
    value: ${{ steps.aggregate.outputs.outcome }}
runs:
  using: composite
  steps:
    - name: Validate delta inputs
      id: validate
      continue-on-error: true
      env:
        ORG_ID: ${{ inputs.org-id }}
        OPEN_SOURCE_PROJECT_ID: ${{ inputs.open-source-project-id }}
      run: |
        set -euo pipefail
        uuid_regex='^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$'
        [[ "$ORG_ID" =~ $uuid_regex ]] || { echo '::error::Snyk organization UUID is invalid'; exit 1; }
        [[ "$OPEN_SOURCE_PROJECT_ID" =~ $uuid_regex ]] || { echo '::error::Open Source project UUID is invalid'; exit 1; }
        [[ -f .snyk ]] || { echo '::error::The repository Snyk policy file is missing'; exit 1; }
      shell: bash

    - name: Set up Node and dependencies
      if: steps.validate.outcome == 'success'
      id: setup-node
      continue-on-error: true
      uses: ./.github/actions/setup-node

    - name: Set up pinned Snyk CLI
      if: steps.validate.outcome == 'success'
      id: snyk-cli
      continue-on-error: true
      uses: snyk/actions/setup@aa6e70d07856828c0902d53c649eb82dea5e04be
      with:
        snyk-version: v1.1308.0

    - name: Install pinned Snyk Delta
      if: steps.validate.outcome == 'success' && steps.setup-node.outcome == 'success'
      id: snyk-delta
      continue-on-error: true
      run: |
        set -euo pipefail
        npm install --global snyk-delta@1.14.0
        test "$(snyk-delta --version)" = '1.14.0'
      shell: bash

    - name: Obtain Snyk OAuth token
      if: steps.validate.outcome == 'success'
      id: snyk-auth
      continue-on-error: true
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/snyk-auth@6db001458db30ae747d9eb8eb25707ce52b359bc
      with:
        client_id: ${{ inputs.snyk-client-id }}
        client_secret: ${{ inputs.snyk-client-secret }}

    - name: Mask Snyk OAuth token
      if: steps.validate.outcome == 'success' && steps.snyk-auth.outcome == 'success'
      id: mask-token
      continue-on-error: true
      env:
        SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
      run: |
        set -euo pipefail
        if [[ -z "$SNYK_OAUTH_TOKEN" || "$SNYK_OAUTH_TOKEN" == *$'\n'* || "$SNYK_OAUTH_TOKEN" == *$'\r'* ]]; then
          echo '::error::Snyk OAuth token is missing or cannot be safely masked'
          exit 1
        fi
        printf '::add-mask::%s\n' "$SNYK_OAUTH_TOKEN"
      shell: bash

    - name: Assess Open Source delta
      if: >-
        steps.validate.outcome == 'success' &&
        steps.setup-node.outcome == 'success' &&
        steps.snyk-cli.outcome == 'success' &&
        steps.snyk-delta.outcome == 'success' &&
        steps.snyk-auth.outcome == 'success' &&
        steps.mask-token.outcome == 'success'
      id: assess-open-source
      continue-on-error: true
      env:
        ORG_ID: ${{ inputs.org-id }}
        OPEN_SOURCE_PROJECT_ID: ${{ inputs.open-source-project-id }}
        SNYK_OAUTH_TOKEN: ${{ steps.snyk-auth.outputs.token }}
        SNYK_API: ${{ env.SNYK_API }}
      run: |
        set -uo pipefail
        export SNYK_TOKEN="$SNYK_OAUTH_TOKEN"
        scan_dir="$(mktemp -d)"
        trap 'rm -rf "$scan_dir"' EXIT
        oss_json="$scan_dir/open-source.json"

        is_operational_scan_error() {
          (( $1 > 1 ))
        }

        is_delta_regression() {
          (( $1 == 1 ))
        }

        is_valid_open_source_output() {
          jq -e '
            def non_empty_string: type == "string" and length > 0;
            def valid_vulnerability:
              (.id | non_empty_string) and
              (.severity | IN("low", "medium", "high", "critical")) and
              ((.type // "vuln") | IN("vuln", "license")) and
              (.from | type == "array" and length > 0 and all(.[]; non_empty_string));

            type == "object" and
            (.vulnerabilities | type == "array") and
            .severityThreshold == "high" and
            (.packageManager | non_empty_string) and
            (.projectName | non_empty_string) and

            all(.vulnerabilities[]; valid_vulnerability)
          ' "$oss_json" >/dev/null
        }

        validate_open_source_baseline() {
          local baseline_json="$scan_dir/open-source-baseline.json"
          local package_manager
          local snyk_api="${SNYK_API:-https://api.snyk.io}"

          package_manager="$(jq -r '.packageManager' "$oss_json")"
          snyk_api="${snyk_api%/}"
          snyk_api="${snyk_api%/v1}"

          if ! curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --header "Authorization: Bearer $SNYK_OAUTH_TOKEN" \
            --header 'Accept: application/json' \
            --output="$baseline_json" \
            "$snyk_api/v1/org/$ORG_ID/project/$OPEN_SOURCE_PROJECT_ID"; then
            echo '::error::Open Source baseline project cannot be read'
            return 1
          fi

          if ! jq -e \
            --arg project_id "$OPEN_SOURCE_PROJECT_ID" \
            --arg package_manager "$package_manager" \
            '
              type == "object" and
              ((.id | ascii_downcase) == ($project_id | ascii_downcase)) and
              .origin == "cli" and
              .type == $package_manager and
              .targetReference == "main" and
              .isMonitored == true and
              (.lastTestedDate | type == "string" and length > 0)
            ' "$baseline_json" >/dev/null; then
            echo '::error::Open Source baseline is not the monitored main project for this package manager'
            return 1
          fi
        }

        run_open_source_delta() {
          local delta_status

          if is_operational_scan_error "$oss_scan_status"; then
            echo "::error::Open Source scan failed with exit code $oss_scan_status"
            return 1
          fi

          if ! is_valid_open_source_output; then
            echo '::error::Open Source scan output is missing or unsupported'
            return 1
          fi

          if ! validate_open_source_baseline; then
            return 1
          fi

          if snyk-delta \
            --baselineOrg "$ORG_ID" \
            --baselineProject "$OPEN_SOURCE_PROJECT_ID" \
            --type vuln < "$oss_json"; then
            echo 'Open Source delta passed'
          else
            delta_status=$?
            if is_delta_regression "$delta_status"; then
              echo '::error::Open Source delta found a new high or critical vulnerability'
            else
              echo "::error::Open Source delta failed with exit code $delta_status"
            fi
            return 1
          fi
        }

        if snyk test \
          --org="$ORG_ID" \
          --dev \
          --severity-threshold=high \
          --policy-path=.snyk \
          --print-deps \
          --json-file-output="$oss_json"; then
          oss_scan_status=0
        else
          oss_scan_status=$?
        fi

        run_open_source_delta
      shell: bash

    - name: Set aggregate outcome
      if: always()
      id: aggregate
      env:
        VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        NODE_SETUP_OUTCOME: ${{ steps.setup-node.outcome }}
        SNYK_CLI_OUTCOME: ${{ steps.snyk-cli.outcome }}
        DELTA_SETUP_OUTCOME: ${{ steps.snyk-delta.outcome }}
        AUTH_OUTCOME: ${{ steps.snyk-auth.outcome }}
        TOKEN_MASK_OUTCOME: ${{ steps.mask-token.outcome }}
        OPEN_SOURCE_ASSESS_OUTCOME: ${{ steps.assess-open-source.outcome }}
      run: |
        set -euo pipefail
        if [[ "$VALIDATION_OUTCOME" == 'success' &&
          "$NODE_SETUP_OUTCOME" == 'success' &&
          "$SNYK_CLI_OUTCOME" == 'success' &&
          "$DELTA_SETUP_OUTCOME" == 'success' &&
          "$AUTH_OUTCOME" == 'success' &&
          "$TOKEN_MASK_OUTCOME" == 'success' &&
          "$OPEN_SOURCE_ASSESS_OUTCOME" == 'success' ]]; then
          echo 'outcome=passed' >> "$GITHUB_OUTPUT"
        else
          echo 'outcome=failed' >> "$GITHUB_OUTPUT"
          exit 1
        fi
      shell: bash
