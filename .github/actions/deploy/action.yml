name: "Deploy"
description: "Deploy docker image to namespace"
inputs:
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true
  app-environment:
    description: "environment to which the app is being deployed [staging, production, etc]"
    required: true
  ecr-repository:
    description: "ECR repository"
    required: true
  ecr-registry_url:
    description: "ECR registry url"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Authenticate to the cluster
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@e0b6695b8ec0679ae36920155fd06539c685a096
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}

    - name: Deploy infrastructure to UAT
      shell: bash
      run: |
        if [ ${{ inputs.app-environment }} == 'uat' ]
        then
          kubectl apply --record=false -f ./infrastructure/laa-record-controlled-work-uat/
        fi

    - name: Set expected name for env-secrets kube secret
      id: secret-name
      shell: bash
      run: |
        if [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "value=env-secrets" >> $GITHUB_OUTPUT
        else
          release_name=$(./scripts/release-name.sh "${{ github.ref_name }}")
          echo "value=${release_name}-env-secrets" >> $GITHUB_OUTPUT
        fi

    - name: Update env-secrets kube secret
      shell: bash
      env:
        K8S_NAMESPACE: ${{ inputs.kube-namespace }}
        SECRET_NAME: ${{ steps.secret-name.outputs.value }}
      run: |
        readarray -t keys <<< "$(yq '.rcw.envSecrets[]' ./deploy/laa-record-controlled-work/values.yaml)"

        args=()
        for key in "${keys[@]}"; do
          args+=(--from-literal="${key}=${!key}")
        done

        kubectl create secret generic "$SECRET_NAME" \
          --namespace="$K8S_NAMESPACE" \
          "${args[@]}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy using Helm
      shell: bash
      run: ./scripts/deploy.sh ${{ inputs.app-environment }}
      env:
        REGISTRY: ${{ inputs.ecr-registry_url }}
        REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ github.sha }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        K8S_NAMESPACE: ${{ inputs.kube-namespace }}
        SECRET_NAME: ${{ steps.secret-name.outputs.value }}
