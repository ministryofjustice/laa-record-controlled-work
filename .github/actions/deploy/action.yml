name: "Deploy"
description: "Deploy docker image to namespace"
inputs:
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true
  app-environment:
    description: "environment to which the app is being deployed [staging, production, etc]"
    required: true
  ecr-repository:
    description: "ECR repository"
    required: true
  ecr-registry_url:
    description: "ECR registry url"
    required: true
  session_secret:
    description: "Session secret"
  session_encryption_key:
    description: "Session encryption key for sensitive data"
    required: true
  nginx-ecr-repository:
    description: "ECR repository for the mirrored nginx-unprivileged image"
    required: true
  ccq-ecr-repository:
    description: "ECR repository for CCQ"
    required: true
  sha:
    description: "Commit SHA to deploy"
    required: true
  branch-ref:
    description: "Branch ref for ephemeral deployments"
    default: ''
  slack-alerts-bot-token:
    description: "Slack app bot token used to post failure notifications"
    required: false
    default: ''
  slack-alerts-channel-id:
    description: "Slack channel ID for failure notifications"
    required: false
    default: ''
  slack-alerts-mention:
    description: "Optional Slack mention token (for example <!subteam^S12345>)"
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ inputs.sha }}

    - name: Authenticate to the cluster
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@e0b6695b8ec0679ae36920155fd06539c685a096
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}

    - name: Deploy infrastructure to UAT
      shell: bash
      run: |
        if [ ${{ inputs.app-environment }} == 'uat' ]
        then
          kubectl apply --record=false -f ./deploy/infrastructure/laa-record-controlled-work-uat/
        fi

    - name: Deploy using Helm
      shell: bash
      run: ./scripts/deploy.sh ${{ inputs.app-environment }}
      env:
        REGISTRY: ${{ inputs.ecr-registry_url }}
        REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ inputs.sha }}
        GITHUB_SHA: ${{ inputs.sha }}
        BRANCH_NAME: ${{ inputs.branch-ref }}
        K8S_NAMESPACE: ${{ inputs.kube-namespace }}
        CCQ_ECR_REPOSITORY: ${{ inputs.ccq-ecr-repository }}
        NGINX_ECR_REPOSITORY: ${{ inputs.nginx-ecr-repository }}

    - name: Comment ephemeral environment URL on PR
      if: ${{ inputs.branch-ref != '' && github.event.pull_request.number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH_NAME: ${{ inputs.branch-ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        LABEL_NAME="ephemeral-deployed"

        if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -Fxq "$LABEL_NAME"; then
          echo "PR #$PR_NUMBER already has '$LABEL_NAME' label; skipping comment."
          exit 0
        fi

        if ! gh label list --limit 1000 --json name --jq '.[].name' | grep -Fxq "$LABEL_NAME"; then
          gh label create "$LABEL_NAME" --description "PR has been deployed to ephemeral environment" --color "0E8A16"
        fi

        RELEASE_NAME=$(./scripts/release-name.sh "$BRANCH_NAME")
        URL="https://${RELEASE_NAME}-laa-record-controlled-work-uat.cloud-platform.service.justice.gov.uk"
        gh pr comment "$PR_NUMBER" --body $'Ephemeral environment deployed:\n'"$URL"
        gh pr edit "$PR_NUMBER" --add-label "$LABEL_NAME"

    - name: Notify deployment failure
      if: ${{ failure() && github.ref == 'refs/heads/main' && inputs.slack-alerts-bot-token != '' && inputs.slack-alerts-channel-id != '' }}
      uses: ./.github/actions/notify-slack
      with:
        slack-bot-token: ${{ inputs.slack-alerts-bot-token }}
        slack-channel-id: ${{ inputs.slack-alerts-channel-id }}
        slack-mention: ${{ inputs.slack-alerts-mention }}
        message: |
          :red_circle: Main deployment failed for RCW environment: ${{ inputs.app-environment }}
          
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
