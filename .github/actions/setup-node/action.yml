name: Setup Node and Dependencies
description: Setup Node.js, enable Corepack, and install dependencies

runs:
  using: "composite"
  steps:
    - name: Read Node version from .nvmrc
      run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV
      shell: bash

    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Enable Corepack and prepare Yarn
      run: |
        corepack enable
        corepack prepare yarn@4.9.2 --activate
      shell: bash

    - name: Log Yarn version
      run: |
        which yarn
        yarn --version
      shell: bash

    - name: SLSA Supply Chain Security
      uses: ministryofjustice/devsecops-actions/sca/slsa@4cd163be7859cd130800d6719d925318826038ea

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
