name: "Notify Slack"
description: "Post a message to Slack using chat.postMessage"
inputs:
  slack-bot-token:
    description: "Slack app bot token"
    required: true
  slack-channel-id:
    description: "Slack channel ID"
    required: true
  slack-mention:
    description: "Optional Slack mention token (for example <!subteam^S12345>)"
    required: false
    default: ''
  message:
    description: "Slack message body text"
    required: true
  unfurl-links:
    description: "Enable link previews"
    required: false
    default: 'true'
  unfurl-media:
    description: "Enable media previews"
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Post message
      shell: bash
      env:
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        SLACK_CHANNEL_ID: ${{ inputs.slack-channel-id }}
        SLACK_MENTION: ${{ inputs.slack-mention }}
        SLACK_MESSAGE: ${{ inputs.message }}
        SLACK_UNFURL_LINKS: ${{ inputs.unfurl-links }}
        SLACK_UNFURL_MEDIA: ${{ inputs.unfurl-media }}
      run: |
        MESSAGE_TEXT="$SLACK_MESSAGE"

        if [ -n "$SLACK_MENTION" ]; then
          printf -v MESSAGE_TEXT '%s\n%s' "$SLACK_MENTION" "$SLACK_MESSAGE"
        fi

        PAYLOAD=$(jq -n \
          --arg channel "$SLACK_CHANNEL_ID" \
          --arg text "$MESSAGE_TEXT" \
          --argjson unfurl_links "$SLACK_UNFURL_LINKS" \
          --argjson unfurl_media "$SLACK_UNFURL_MEDIA" \
          '{channel: $channel, text: $text, unfurl_links: $unfurl_links, unfurl_media: $unfurl_media}')

        RESPONSE=$(curl --silent --show-error --fail-with-body \
          -X POST "https://slack.com/api/chat.postMessage" \
          -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
          -H "Content-type: application/json; charset=utf-8" \
          --data "$PAYLOAD")

        if ! jq -e '.ok == true' >/dev/null <<<"$RESPONSE"; then
          echo "Slack API response: $RESPONSE"
          exit 1
        fi
