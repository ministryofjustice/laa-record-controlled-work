# CI-only compose overrides.
# Enables BuildKit GitHub Actions cache across workflows/branches for all local-build services.
services:
  rcw:
    build:
      cache_from:
        - type=gha,scope=rcw-e2e-rcw
      cache_to:
        - type=gha,scope=rcw-e2e-rcw,mode=max

  rcw-api:
    build:
      cache_from:
        - type=gha,scope=rcw-e2e-rcw-api
      cache_to:
        - type=gha,scope=rcw-e2e-rcw-api,mode=max

  info-and-advice-api:
    build:
      cache_from:
        - type=gha,scope=rcw-e2e-datastore
      cache_to:
        - type=gha,scope=rcw-e2e-datastore,mode=max

  ccq-image-prebuild:
    build:
      cache_from:
        - type=gha,scope=rcw-e2e-ccq
      cache_to:
        - type=gha,scope=rcw-e2e-ccq,mode=max

  cfe:
    build:
      cache_from:
        - type=gha,scope=rcw-e2e-cfe
      cache_to:
        - type=gha,scope=rcw-e2e-cfe,mode=max
