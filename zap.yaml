# ZAP Automation Framework plan for laa-record-controlled-work.
#
# Runs against the local docker-compose stack (see docker/compose/up --ci) and uses
# Browser Based Authentication to drive the same mock OAuth2 sign-in flow used by the
# Playwright E2E tests (tests/e2e/flows/auth.flow.ts). The mock IdP login form
# (mock-oauth2-login.html) is pre-filled with valid defaults.
env:
  contexts:
    - name: rcw
      urls:
        - "http://localhost:8080"
      excludePaths:
        - "http://localhost:8080/auth/code/callback.*"
      authentication:
        method: "browser"
        parameters:
          loginPageUrl: "http://localhost:8080/"
          loginPageWait: 10
          browserId: "firefox-headless"
          steps:
            - description: "Submit the mock OAuth2 sign-in form (fields are pre-filled with valid defaults)"
              type: "CLICK"
              xpath: "//button[@type='submit']"
              timeout: 5000
        verification:
          method: "poll"
          pollUrl: "http://localhost:8080/"
          pollFrequency: 1
          pollUnits: "requests"
          loggedOutRegex: "\\QMock OAuth2 Server Sign-in\\E"
      sessionManagement:
        method: "cookie"
      users:
        - name: "test-user"
          credentials:
            username: "test.user@example.com"
            password: "NOTUSED"
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: "spider"
    parameters:
      context: "rcw"
      user: "test-user"
      url: "http://localhost:8080/"
      maxDuration: 5
  - type: "passiveScan-wait"
    parameters:
      maxDuration: 5
  - type: "outputSummary"
    parameters:
      format: "Long"
      summaryFile: "/zap/wrk/tmp/zap_out.json"
  - type: "report"
    parameters:
      reportDescription: "RCW ZAP Baseline Scan"
      reportDir: "/zap/wrk/tmp/"
      reportFile: "zap-baseline-report"
      reportTitle: "RCW ZAP Scanning Report"
      template: "traditional-html"
